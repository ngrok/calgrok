name: "Build and Push Container (ngrok-calgrok / app_3HmwtiJqWcO4zT5JjcmeQvxpEpa)"

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_REFERENCE: "registry.ship.ngrok.com/ac_1gbcp4ul5rptr9eqgwj21icgsux/app_3hmwtijqwco4zt5jjcmeqvxpepa"
  NGROK_APP_ID: "app_3HmwtiJqWcO4zT5JjcmeQvxpEpa"

jobs:
  build-and-push:
    # Pushes to ngrok's own image registry, so it can only work in this repo.
    # Skipped in forks, which have neither the registry credentials nor the app.
    if: github.repository == 'ngrok/calgrok'
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"

      - uses: "docker/login-action@v4"
        with:
          registry: "registry.ship.ngrok.com"
          username: "creg_3Fpsi82fNgKVILsGzy3HzE5JA28"
          password: "${{ secrets.NGROK_REGISTRY_PASSWORD_CREG_3FPSI82FNGKVILSGZY3HZE5JA28 }}"

      - id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: "${{ env.IMAGE_REFERENCE }}"
          tags: |
            type=sha,format=long,prefix=

      - uses: "docker/build-push-action@v7"
        with:
          context: "."
          file: "Dockerfile"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: "Write image reference"
        run: |
          cat <<EOF > ngrok-image.json
          {"image":"${{ steps.meta.outputs.tags }}","commit_sha":"${{ github.sha }}"}
          EOF

      - uses: "actions/upload-artifact@v7"
        with:
          name: "ngrok-compute-image"
          path: "ngrok-image.json"
