#:schema https://conductor.build/schemas/settings.repo.schema.json

# calgrok — shared Conductor repository settings.
# Package manager: pnpm. App architecture: see PLAN.md.

# Copy local, gitignored env files into every new workspace. The app cannot run
# without .env (Linear OAuth client id/secret, redirect URI, SESSION_SECRET):
# .env.example is committed, but .env is not, so it must be copied in.
file_include_globs = ".env*\n"

[scripts]
# Install dependencies with the repo's package manager.
setup = "pnpm install"

# Start the dev server, pinned to port 3000 (--strictPort fails fast instead of
# silently drifting to another port). The Linear OAuth redirect URI
# http://localhost:3000/auth/linear/callback is registered with the Linear app,
# so sign-in only works on this exact host:port.
run = "pnpm dev --port 3000 --strictPort"

# Only one workspace can run at a time: the app is bound to the single fixed
# OAuth port 3000. To allow concurrent runs, register additional localhost
# callback URLs in the Linear app, set LINEAR_REDIRECT_URI per workspace, and
# switch the run command to `pnpm dev --port $CONDUCTOR_PORT`.
run_mode = "nonconcurrent"
